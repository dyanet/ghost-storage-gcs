name: CI

on:
  push:
    branches: [master, "release/**"]
    tags: ["v*"]
    paths-ignore:
      - "example/**"
      - "**.md"
  pull_request:
    branches: [master, "release/**"]
    paths-ignore:
      - "example/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every Node line's real result instead of cancelling the rest
      # on the first failure.
      fail-fast: false
      matrix:
        # engines.node is >=22.12 (require() of ghost-storage-base 3, which is
        # ESM-only), matching current Ghost's Node 22/24 requirement.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails on a known high/critical advisory in anything that ships to
      # users. Dev-only advisories are left to Dependabot.
      - name: Audit runtime dependencies
        if: matrix.node-version == 24
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Ghost require()s the adapter and uses the result as the class.
      - name: Smoke-test the built CommonJS entry point
        run: node -e "const G=require('./'); if (typeof G!=='function'||G.default!==G) { console.error('dist does not export the adapter class'); process.exit(1) }"

      - name: Coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

  # Releases happen two ways:
  #  - a pushed v* tag, or
  #  - merging a version bump to master: on a push to master this job checks
  #    whether v<package.json version> is already tagged and does nothing if
  #    it is, so ordinary commits are a no-op rather than a red "cannot
  #    publish over" failure. It tags the commit itself afterwards; a tag
  #    pushed with GITHUB_TOKEN does not re-trigger workflows.
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || ((github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'push')
    permissions:
      contents: write # to tag the release commit
      packages: write
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@dyanet"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Decide whether to release
        id: rel
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # dist-tag: `latest` only if this version is newer than npmjs's
          # current latest. An older line (e.g. a 2.x fix after 3.0.0) goes
          # out as `v<major>` so approving it can't move `latest` backwards.
          # (Read with curl: the @dyanet scope is mapped to GitHub Packages.)
          NAME=$(node -p "require('./package.json').name")
          LATEST=$(curl -fsS "https://registry.npmjs.org/${NAME/\//%2f}" 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s)['dist-tags'].latest||'')}catch{}})" || true)
          if [ -n "$LATEST" ] && npx -y semver -r "<$LATEST" "$PKG_VERSION" >/dev/null; then
            DIST_TAG="v${PKG_VERSION%%.*}"
          else
            DIST_TAG=latest
          fi
          echo "npmjs latest: ${LATEST:-none}; releasing $PKG_VERSION with dist-tag '$DIST_TAG'"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null; then
            echo "v$PKG_VERSION is already tagged - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$PKG_VERSION is not tagged yet - releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.rel.outputs.release == 'true'
        run: npm run build

      - name: Publish to GitHub Packages
        if: steps.rel.outputs.release == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on GitHub Packages - skipping."
          else
            npm publish --registry=https://npm.pkg.github.com --tag "${{ steps.rel.outputs.dist_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Writes its own npmrc: setup-node mapped @dyanet to GitHub Packages,
      # and for a scoped package that mapping beats --registry.
      #
      # Stages the release on npmjs through npm Trusted Publishing (OIDC, via
      # `id-token: write`); no token is involved. The trusted publisher for
      # this package allows staging, not direct publishing, so nothing goes
      # live until a maintainer approves it with 2FA: npmjs.com > Staged
      # Packages > Approve, or `npm stage approve <stage-id>`.
      # `npm stage list` needs a logged-in user, so CI can't see what's already
      # staged; the release tag pushed below is what stops a re-stage.
      - name: Stage on npmjs (approve on npmjs.com to publish)
        if: steps.rel.outputs.release == 'true'
        run: |
          npm install -g npm@latest # `npm stage` needs a current npm

          NPMRC="$RUNNER_TEMP/.npmrc-npmjs"
          printf 'registry=https://registry.npmjs.org/\n@dyanet:registry=https://registry.npmjs.org/\n' > "$NPMRC"

          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version --userconfig "$NPMRC" >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published on npmjs - skipping."
          else
            npm stage publish --userconfig "$NPMRC" --access public --provenance --tag "${{ steps.rel.outputs.dist_tag }}"
            echo "::notice title=Approve on npmjs::$NAME@$VERSION is staged with dist-tag '${{ steps.rel.outputs.dist_tag }}'. Approve it at npmjs.com > Staged Packages (2FA), or run: npm stage approve <stage-id>"
          fi

      - name: Tag the release commit
        if: steps.rel.outputs.release == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
        run: |
          TAG="v${{ steps.rel.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
